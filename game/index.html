<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Cascade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08091a; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: status line for screen readers. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Nova Cascade: 2D Arcade Space Game. Dodge asteroids, defeat wave bosses, collect energy crystals, and upgrade your ship."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
