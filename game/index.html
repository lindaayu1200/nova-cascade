<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Cascade</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #03040d;
    color: #f3f6ff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Nova Cascade: steer a cyan ship through a deep-indigo asteroid field, auto-fire at splitting rocks and homing drones, collect gold energy crystals, and spend them on upgrades between waves."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
